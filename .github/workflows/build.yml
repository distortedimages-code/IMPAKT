# IMPAKT: builds the plugin and the app for macOS (universal), Windows and Linux on every push; when VERSION on main
# names a version not released yet, the three installers go into a GitHub release (tag vX.Y.Z), where the plugin's
# updater and the site find them.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'site/**', '*.md', '.github/workflows/site.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  JUCE_TAG: '9.0.3'

jobs:
  mac:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_TAG }}-${{ runner.os }}
      - name: JUCE
        run: '[ -d JUCE/modules ] || git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git JUCE'
      - name: Tools
        run: |
          brew install ninja || true
          python3 -m pip install --break-system-packages dmgbuild || python3 -m pip install dmgbuild
      - name: Configure
        run: >
          cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="$PWD/JUCE"
          -DIMPAKT_COPY_AFTER_BUILD=OFF -DIMPAKT_EMBED_BANK=OFF -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --target IMPAKT_VST3 IMPAKT_AU IMPAKT_Standalone
      - name: Disk image
        run: packaging/mac/make_dmg.sh build/IMPAKT_artefacts/Release out
      - name: Check the disk image
        run: |
          MNT=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" out/IMPAKT-macOS.dmg
          ls -la "$MNT"
          for l in VST3 Components Applications; do echo "$l -> $(readlink "$MNT/$l")"; done
          pkgutil --expand "$MNT/Install IMPAKT.pkg" "$RUNNER_TEMP/pkg" && ls "$RUNNER_TEMP/pkg"
          for b in IMPAKT.vst3 IMPAKT.component IMPAKT.app; do
            codesign -dv "$MNT/$b" 2>&1 | grep -E "Identifier|Signature|Format"
          done
          ls -la "$MNT/IMPAKT/bank"
          hdiutil detach "$MNT"
      - uses: actions/upload-artifact@v4
        with: { name: IMPAKT-macOS, path: out/IMPAKT-macOS.dmg, if-no-files-found: error }

  windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_TAG }}-${{ runner.os }}
      - name: JUCE
        shell: bash
        run: '[ -d JUCE/modules ] || git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git JUCE'
      - name: WebView2 SDK, Ninja, Inno Setup
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory "$env:RUNNER_TEMP\webview2" -NonInteractive
          choco install ninja innosetup -y --no-progress
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Configure
        shell: pwsh
        # (JUCE 9's WebP SSE4.1 code does not build with clang-cl: off, for the plugin and for JUCE's own helper,
        # juceaide, which CMake configures apart and which only sees the flags of the environment)
        env:
          CFLAGS: -DJUCE_USE_WEBP=0
          CXXFLAGS: -DJUCE_USE_WEBP=0
        run: |
          where.exe clang-cl
          cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DJUCE_PATH="$PWD/JUCE" -DIMPAKT_COPY_AFTER_BUILD=OFF -DIMPAKT_EMBED_BANK=OFF -DIMPAKT_LTO=OFF `
            -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:RUNNER_TEMP\webview2"
      - name: Build
        run: cmake --build build --target IMPAKT_VST3 IMPAKT_Standalone -- -k 0
      - name: Installer
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -TotalCount 1).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DVersion=$ver" "/DArt=$PWD\build\IMPAKT_artefacts\Release" "/DRoot=$PWD" "/O$PWD\out" packaging\windows\impakt.iss
          Get-Item out\IMPAKT-Windows-Setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: IMPAKT-Windows, path: out/IMPAKT-Windows-Setup.exe, if-no-files-found: error }

  linux:
    name: Linux (x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_TAG }}-${{ runner.os }}
      - name: JUCE
        run: '[ -d JUCE/modules ] || git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git JUCE'
      - name: Packages
        # (a mirror that stops answering must not hold the job for hours: each attempt is cut short, then tried again)
        timeout-minutes: 25
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          PKGS="ninja-build libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev"
          for i in 1 2 3; do
            if timeout 480 sudo apt-get $APT update && timeout 600 sudo apt-get $APT install -y --no-install-recommends $PKGS; then exit 0; fi
            echo "apt attempt $i failed, retrying"; sleep 20
          done
          exit 1
      - name: Configure
        run: cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="$PWD/JUCE" -DIMPAKT_COPY_AFTER_BUILD=OFF -DIMPAKT_EMBED_BANK=OFF
      - name: Build
        run: cmake --build build --target IMPAKT_VST3 IMPAKT_Standalone
      - name: Archive
        run: |
          packaging/linux/make_tar.sh build/IMPAKT_artefacts/Release out
          tar tzvf out/IMPAKT-Linux.tar.gz
      - uses: actions/upload-artifact@v4
        with: { name: IMPAKT-Linux, path: out/IMPAKT-Linux.tar.gz, if-no-files-found: error }

  release:
    # a new VERSION on main (no release of that number yet): the three installers go into a GitHub release, tagged
    # vX.Y.Z on this commit, with that version's section of CHANGELOG.md as its notes
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is it a new version?
        id: ver
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          VER=$(head -n 1 VERSION | tr -d '[:space:]')
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then echo "new=no" >> "$GITHUB_OUTPUT"; echo "v$VER is out already"; else echo "new=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.new == 'yes'
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        if: steps.ver.outputs.new == 'yes'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          VER=${{ steps.ver.outputs.ver }}
          awk -v v="$VER" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {if (on) exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "IMPAKT $VER" > notes.md
          ls -l dist
          gh release create "v$VER" dist/IMPAKT-macOS.dmg dist/IMPAKT-Windows-Setup.exe dist/IMPAKT-Linux.tar.gz \
            --target "$GITHUB_SHA" --title "IMPAKT $VER" --notes-file notes.md
