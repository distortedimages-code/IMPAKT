# IMPAKT: builds the plugin and the app for macOS (universal), Windows and Linux on every push; on a v* tag (matching
# VERSION) the three installers go into a GitHub release, where the plugin's updater and the site find them.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', 'site/**', '*.md', '.github/workflows/site.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  JUCE_TAG: '9.0.3'

jobs:
  mac:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_TAG }}-${{ runner.os }}
      - name: JUCE
        run: '[ -d JUCE/modules ] || git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git JUCE'
      - name: Tools
        run: |
          brew install ninja || true
          python3 -m pip install --break-system-packages dmgbuild || python3 -m pip install dmgbuild
      - name: Configure
        run: >
          cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="$PWD/JUCE"
          -DIMPAKT_COPY_AFTER_BUILD=OFF -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --target IMPAKT_VST3 IMPAKT_AU IMPAKT_Standalone
      - name: Disk image
        run: packaging/mac/make_dmg.sh build/IMPAKT_artefacts/Release out
      - uses: actions/upload-artifact@v4
        with: { name: IMPAKT-macOS, path: out/IMPAKT-macOS.dmg, if-no-files-found: error }

  windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_TAG }}-${{ runner.os }}
      - name: JUCE
        shell: bash
        run: '[ -d JUCE/modules ] || git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git JUCE'
      - name: WebView2 SDK, Ninja, Inno Setup
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory "$env:RUNNER_TEMP\webview2" -NonInteractive
          choco install ninja innosetup -y --no-progress
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Configure
        shell: pwsh
        # (JUCE 9's WebP SSE4.1 code does not build with clang-cl: off, for the plugin and for JUCE's own helper,
        # juceaide, which CMake configures apart and which only sees the flags of the environment)
        env:
          CFLAGS: -DJUCE_USE_WEBP=0
          CXXFLAGS: -DJUCE_USE_WEBP=0
        run: |
          where.exe clang-cl
          cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DJUCE_PATH="$PWD/JUCE" -DIMPAKT_COPY_AFTER_BUILD=OFF -DIMPAKT_LTO=OFF `
            -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:RUNNER_TEMP\webview2"
      - name: Build
        run: cmake --build build --target IMPAKT_VST3 IMPAKT_Standalone -- -k 0
      - name: Installer
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -TotalCount 1).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DVersion=$ver" "/DArt=$PWD\build\IMPAKT_artefacts\Release" "/DRoot=$PWD" "/O$PWD\out" packaging\windows\impakt.iss
          Get-Item out\IMPAKT-Windows-Setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: IMPAKT-Windows, path: out/IMPAKT-Windows-Setup.exe, if-no-files-found: error }

  linux:
    name: Linux (x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_TAG }}-${{ runner.os }}
      - name: JUCE
        run: '[ -d JUCE/modules ] || git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git JUCE'
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev
      - name: Configure
        run: cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="$PWD/JUCE" -DIMPAKT_COPY_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --target IMPAKT_VST3 IMPAKT_Standalone
      - name: Archive
        run: packaging/linux/make_tar.sh build/IMPAKT_artefacts/Release out
      - uses: actions/upload-artifact@v4
        with: { name: IMPAKT-Linux, path: out/IMPAKT-Linux.tar.gz, if-no-files-found: error }

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          VER=$(head -n 1 VERSION | tr -d '[:space:]')
          TAG="${GITHUB_REF_NAME}"
          [ "$TAG" = "v$VER" ] || { echo "the tag $TAG does not match VERSION ($VER)"; exit 1; }
          # the notes: this version's section of CHANGELOG.md
          awk -v v="$VER" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {if (on) exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "IMPAKT $VER" > notes.md
          ls -l dist
          gh release create "$TAG" dist/IMPAKT-macOS.dmg dist/IMPAKT-Windows-Setup.exe dist/IMPAKT-Linux.tar.gz \
            --title "IMPAKT $VER" --notes-file notes.md --verify-tag
